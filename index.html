<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発注書作成システム — 大阪テック株式会社</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --border:#d5dbe3; --accent:#1f5fa8;
    --accent-d:#164680; --text:#1a2330; --muted:#667085; --ok:#1a9c5b;
    --shadow:0 2px 10px rgba(20,40,80,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;}
  header.app{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
    padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
  header.app h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.5px;}
  header.app .sub{font-size:12px;opacity:.85;}
  .wrap{max-width:1080px;margin:22px auto;padding:0 18px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px;}
  .panel h2{font-size:15px;margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid var(--accent);
    color:var(--accent-d);display:flex;align-items:center;gap:8px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  select,input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
    font-size:14px;background:#fff;color:var(--text);transition:.15s;}
  select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,168,.13);}
  select:disabled,input:disabled{background:#f0f2f5;color:#333;}
  .readonly{background:#eef2f7 !important;font-weight:600;color:#1a2330;}
  .row-flex{display:flex;gap:14px;flex-wrap:wrap;}
  .row-flex>div{flex:1;min-width:150px;}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;
    transition:.15s;display:inline-flex;align-items:center;gap:7px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-d);}
  .btn-primary:disabled{background:#9db4cf;cursor:not-allowed;}
  .btn-ghost{background:#eef2f7;color:var(--accent-d);}
  .btn-ghost:hover{background:#e0e8f2;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .info-line{font-size:13px;color:var(--muted);margin:6px 0 0;}
  .amount-box{background:#eef7f1;border:1px solid #b9e0c9;border-radius:8px;padding:12px 16px;
    display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
  .amount-box .lbl{font-size:12px;color:var(--ok);font-weight:700;}
  .amount-box .val{font-size:22px;font-weight:800;color:#0f7a43;}
  .status{font-size:13px;margin-left:auto;color:var(--muted);}
  .status.ok{color:var(--ok);font-weight:700;}
  .status.err{color:#c0392b;font-weight:700;}
  .tag{display:inline-block;background:#eef2f7;color:var(--accent-d);border-radius:20px;
    padding:3px 12px;font-size:12px;font-weight:700;}
  /* ヘッダの発注担当者入力 */
  .hdr-staff{margin-left:auto;text-align:right;font-size:12px;opacity:.95;
    display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .hdr-staff label{margin:0;font-size:11px;color:#fff;opacity:.85;font-weight:600;}
  .hdr-staff input{width:150px;padding:5px 9px;font-size:13px;font-weight:600;
    border:1px solid rgba(255,255,255,.5);border-radius:6px;
    background:rgba(255,255,255,.15);color:#fff;}
  .hdr-staff input::placeholder{color:rgba(255,255,255,.6);font-weight:400;}
  .hdr-staff input:focus{outline:none;background:#fff;color:var(--text);
    border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25);}
  /* ===== マスタ管理UI ===== */
  .btn-danger{background:#c0392b;color:#fff;}
  .btn-danger:hover{background:#a03024;}
  .btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
  .panel h2 .h2-actions{margin-left:auto;display:flex;gap:8px;}
  .mtbl-wrap{max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  table.mtbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.mtbl th{background:#eef2f7;color:var(--accent-d);font-size:12px;font-weight:700;
    padding:8px 10px;text-align:left;position:sticky;top:0;z-index:1;
    border-bottom:1px solid var(--border);white-space:nowrap;}
  table.mtbl td{padding:7px 10px;border-bottom:1px solid #eceff3;vertical-align:middle;}
  table.mtbl tbody tr:hover{background:#f7fafd;}
  table.mtbl td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.mtbl td.ops{text-align:right;white-space:nowrap;}
  table.mtbl .empty{text-align:center;color:var(--muted);padding:22px;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.45);display:none;
    align-items:center;justify-content:center;z-index:50;padding:18px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:640px;
    box-shadow:0 12px 40px rgba(10,25,60,.3);max-height:90vh;overflow:auto;}
  .modal-head{padding:16px 22px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;}
  .modal-head h3{margin:0;font-size:15px;color:var(--accent-d);}
  .modal-head .x{margin-left:auto;cursor:pointer;border:none;background:none;
    font-size:20px;color:var(--muted);line-height:1;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);
    display:flex;gap:10px;justify-content:flex-end;align-items:center;}
  .modal-foot .msg{margin-right:auto;font-size:13px;font-weight:700;}
  .modal-foot .msg.err{color:#c0392b;}
  .modal-foot .msg.ok{color:var(--ok);}
  .req::after{content:" *";color:#c0392b;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .filter-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
  .filter-row select,.filter-row input{width:auto;min-width:170px;}
  /* Print preview area */
  #previewArea{margin-top:8px;}
  .doc-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}

  /* ===== 印刷帳票レイアウト（テンプレート再現・A4全5書1枚） ===== */
  .sheet{background:#fff;width:194mm;margin:0 auto 16px;padding:0;
    border:1px solid #ccc;box-shadow:0 1px 8px rgba(0,0,0,.12);color:#000;
    font-family:"Meiryo","Hiragino Kaku Gothic ProN",sans-serif;}
  .form-block{padding:0;margin-bottom:0;}
  /* ヘッダ部 */
  .thead{padding:0 2mm 1mm;}
  .th-titlebar{display:flex;justify-content:space-between;align-items:flex-start;
    position:relative;padding-top:1px;}
  .th-titlebar.three{align-items:flex-start;}
  .th-title{font-size:17px;font-weight:800;letter-spacing:6px;text-align:center;
    position:absolute;left:0;right:0;top:1px;pointer-events:none;
    border-bottom:1.5px solid #000;padding-bottom:1px;width:34%;margin:0 auto;}
  .th-onbox{font-size:10px;line-height:1.3;text-align:right;margin-left:auto;z-index:1;}
  .th-onleft{font-size:10px;line-height:1.3;z-index:1;}
  .th-onbox .onbox,.th-onleft .onbox{border:1.4px solid #000;padding:1px 9px;
    display:inline-block;font-size:14px;font-weight:700;margin-bottom:1px;}
  .th-onbox .onbox b,.th-onleft .onbox b{font-size:16px;}
  /* オーダーNoを見やすく：下地に薄い水色、左に強調バー（左右共通） */
  .th-onleft .onbox,.th-onbox .onbox{background:#e8f4fb;border:1.4px solid #1a9fd6;border-left:4px solid #1a9fd6;
    border-radius:3px;color:#0b3c52;}
  .th-onleft .onbox b,.th-onbox .onbox b{color:#0a5a7a;}
  .th-addr{display:flex;justify-content:space-between;font-size:10px;line-height:1.3;
    margin-top:1mm;}
  .th-left,.th-right{}
  .th-right{text-align:right;}
  .thead .big{font-size:13px;font-weight:700;}
  .thead .onchu{font-size:13px;font-weight:700;}
  .ownlogo{display:inline-block;height:auto;width:auto;max-width:34mm;max-height:7mm;
    object-fit:contain;margin:1px 0;}
  /* オーダーNo・発注日のすぐ左隣にロゴを配置 */
  .th-onno-row{display:flex;align-items:center;justify-content:flex-end;gap:2.5mm;
    margin-bottom:1px;}
  /* 会社名の左隣にロゴ（発注書用） */
  .th-name-row{display:flex;align-items:center;justify-content:flex-end;gap:2.5mm;}
  /* 発注日・担当者を一行下げるためのスペーサー */
  .th-spacer{height:1.3em;}
  .ownlogo-side{margin:0;flex:0 0 auto;}
  /* 明細テーブル */
  table.ttbl{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;
    border:1.4px solid #000;}
  table.ttbl td{border:1px solid #000;padding:0 4px;text-align:center;
    vertical-align:middle;height:15px;overflow:hidden;}
  table.ttbl td.lbl{background:#d5d9de;font-weight:700;white-space:nowrap;}
  table.ttbl td.val{font-weight:600;}
  table.ttbl td.left{text-align:left;}
  table.ttbl td.sig{height:20px;}
  /* 品名・備考：1行表示（折返さない） */
  table.ttbl td.pname{text-align:left;white-space:nowrap;overflow:hidden;
    padding:0 8px;font-size:12px;vertical-align:middle;}
  table.ttbl td.biko{text-align:left;white-space:nowrap;padding:0 8px;vertical-align:middle;}
  table.ttbl tr.gh td{height:15px;}
  /* 備考のBDW：文字間隔を広く */
  .biko-circ{letter-spacing:0;}
  .biko-circ span{display:inline-block;border:1.4px solid #000;border-radius:50%;
    width:18px;height:18px;line-height:15px;text-align:center;margin:0 6px;font-size:11px;font-weight:700;}
  /* 切り取り線 */
  .cut-line{display:flex;align-items:center;gap:10px;color:#333;font-size:10px;
    padding:0 0;margin:0.3mm 0;border:none;background:none;}
  .cut-line::before,.cut-line::after{content:"";flex:1;height:0;
    border-top:1.2px dashed #555;}
  .cut-line .scissors{font-size:14px;line-height:1;}
  @media print{
    html,body{background:#fff !important;margin:0 !important;padding:0 !important;}
    header.app,.no-print,.doc-toolbar{display:none !important;}
    .wrap>.panel.no-print{display:none !important;}
    .wrap{max-width:none !important;margin:0 !important;padding:0 !important;}
    #previewPanel{display:block !important;border:none !important;box-shadow:none !important;
      padding:0 !important;margin:0 !important;background:#fff !important;}
    #previewArea{margin:0 !important;padding:0 !important;}
    /* 用紙の高さいっぱいに5書を均等配置して下余白をなくす（高さはJSで用紙別に注入） */
    .sheet{margin:0 !important;border:none !important;box-shadow:none !important;
      width:auto !important;padding:0 !important;
      display:flex;flex-direction:column;
      page-break-after:auto;break-after:auto;overflow:hidden;}
    .form-block{break-inside:avoid;page-break-inside:avoid;flex:0 0 auto;}
    /* 切り取り線が余白を吸収して全体を上下いっぱいに広げる */
    .cut-line{break-inside:avoid;page-break-inside:avoid;flex:1 1 auto;
      min-height:2mm;}
    table.ttbl td.lbl{background:#d5d9de !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .th-onleft .onbox,.th-onbox .onbox{background:#e8f4fb !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  /* 画面プレビューで用紙サイズを切替 */
  body.paper-a4 .sheet{width:194mm;}
</style>
</head>
<body>
<header class="app">
  <div>
    <h1>発注書作成システム</h1>
    <div class="sub">大阪テック株式会社 ／ 外注加工発注書</div>
  </div>
  <div class="hdr-staff">
    <label for="staffInput">発注担当者</label>
    <input id="staffInput" list="staffList" placeholder="担当者名" autocomplete="off">
    <datalist id="staffList"></datalist>
    <span id="todayDisp"></span>
  </div>
</header>

<div class="wrap">

  <!-- 入力パネル -->
  <div class="panel no-print">
    <h2>① 発注内容の入力</h2>
    <div class="grid">
      <div>
        <label>外注先</label>
        <select id="supplier"><option value="">— 選択 —</option></select>
      </div>
      <div>
        <label>製品（管理No / 製品名）</label>
        <select id="product" disabled><option value="">— 外注先を選択 —</option></select>
      </div>
    </div>

    <div class="grid" style="margin-top:14px;">
      <div><label>製番（管理No）</label><input id="kanri" class="readonly" readonly></div>
      <div><label>図番（OT番号）</label><input id="otno" class="readonly" readonly></div>
      <div><label>品名（製品名）</label><input id="pname" class="readonly" readonly></div>
    </div>

    <div class="grid" style="margin-top:14px;">
      <div><label>備考（作業区分）</label><input id="biko" placeholder="製品選択で自動入力・編集可"></div>
      <div><label>発注単価（加工単価）</label><input id="price" class="readonly" readonly></div>
    </div>

    <div class="grid" style="margin-top:14px;">
      <div><label>納期（任意入力）</label><input id="delivery" type="text" placeholder="例）8/20 または 2026-08-20"></div>
      <div><label>発注数（任意入力）</label><input id="qty" type="number" min="1" step="1" placeholder="数量"></div>
      <div>
        <label>単位</label>
        <input id="unit" list="unitList2" placeholder="本" autocomplete="off">
        <datalist id="unitList2"></datalist>
      </div>
    </div>

    <div class="amount-box" style="margin-top:16px;">
      <span class="lbl">発注金額（発注数 × 発注単価）</span>
      <span class="val" id="amountDisp">¥0</span>
    </div>
  </div>

  <!-- 作成パネル -->
  <div class="panel no-print">
    <h2>② 発注書の作成</h2>
    <div class="actions">
      <label style="display:flex;align-items:center;gap:6px;">オーダーNo
        <input id="orderNoInput" style="width:120px;" placeholder="製品選択で自動採番">
      </label>
      <button class="btn btn-primary" id="createBtn" disabled>発注書を作成する</button>
      <span class="info-line">作成時に自動採番されます。必要なら書き換え可。</span>
      <span class="status" id="statusMsg"></span>
    </div>
  </div>

  <!-- マスタ管理パネル -->
  <div class="panel no-print">
    <h2>③ マスタ管理（外注先・製品・単価）
      <span class="h2-actions">
        <button class="btn btn-ghost btn-sm" id="mReloadBtn">🔄 再読込</button>
        <button class="btn btn-primary btn-sm" id="mAddBtn">＋ 新規登録</button>
      </span>
    </h2>
    <div class="filter-row">
      <select id="mFilterSup"><option value="">— 全外注先 —</option></select>
      <input id="mFilterKw" type="text" placeholder="管理No・図番・製品名で絞込">
      <span class="info-line" id="mCount" style="margin:0;"></span>
    </div>
    <div class="mtbl-wrap">
      <table class="mtbl">
        <thead>
          <tr>
            <th style="width:14%">外注先</th>
            <th style="width:13%">製番(管理No)</th>
            <th style="width:14%">図番(OT番号)</th>
            <th>品名(製品名)</th>
            <th style="width:12%">備考(作業区分)</th>
            <th style="width:7%">単位</th>
            <th style="width:11%">単価</th>
            <th style="width:14%"></th>
          </tr>
        </thead>
        <tbody id="mBody"><tr><td colspan="8" class="empty">読込中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- マスタ登録／編集モーダル -->
  <div class="modal-bg" id="mModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="mModalTitle">マスタ新規登録</h3>
        <button class="x" id="mCloseBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="grid">
          <div>
            <label class="req">外注先</label>
            <input id="fSupplier" list="supplierList" placeholder="例）田中鉄工">
            <datalist id="supplierList"></datalist>
            <div class="hint">既存を選ぶか、新しい外注先名を直接入力できます。</div>
          </div>
          <div>
            <label class="req">製番（管理No）</label>
            <input id="fKanri" placeholder="例）MB-8000H">
          </div>
        </div>
        <div class="grid" style="margin-top:14px;">
          <div>
            <label>図番（OT番号）</label>
            <input id="fOtno" placeholder="例）OT-12345">
          </div>
          <div>
            <label class="req">品名（製品名）</label>
            <input id="fPname" placeholder="例）ベースプレート">
          </div>
        </div>
        <div class="grid" style="margin-top:14px;">
          <div>
            <label>備考（作業区分）</label>
            <input id="fBiko" placeholder="例）BDW">
            <div class="hint">帳票では1文字ずつ〇で囲まれて印字されます。</div>
          </div>
          <div>
            <label class="req">発注単価（加工単価）</label>
            <input id="fPrice" type="number" min="0" step="1" placeholder="例）12000">
          </div>
        </div>
        <div class="grid" style="margin-top:14px;">
          <div>
            <label class="req">単位</label>
            <input id="fUnit" list="unitList" placeholder="例）本" autocomplete="off">
            <datalist id="unitList"></datalist>
            <div class="hint">一覧から選ぶか、新しい単位を直接入力できます。</div>
          </div>
          <div></div>
        </div>
        <div class="grid" style="margin-top:14px;">
          <div>
            <label>外注先 郵便番号</label>
            <input id="fZip" placeholder="例）561-0845">
          </div>
          <div>
            <label>外注先 住所</label>
            <input id="fAddr" placeholder="例）大阪府豊中市利倉2-5-2">
            <div class="hint">発注書の宛先に印字されます（外注先単位で保持）。</div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="msg" id="mMsg"></span>
        <button class="btn btn-ghost" id="mCancelBtn">キャンセル</button>
        <button class="btn btn-primary" id="mSaveBtn">保存する</button>
      </div>
    </div>
  </div>

  <!-- プレビュー / 印刷 -->
  <div class="panel" id="previewPanel" style="display:none;">
    <div class="doc-toolbar no-print">
      <span class="tag" id="orderNoTag">オーダーNo —</span>
      <span style="font-size:12px;color:#667085;font-weight:600;">用紙: A4</span>
      <button class="btn btn-primary" onclick="window.print()">🖨 印刷 / PDF保存</button>
      <button class="btn btn-ghost" id="newBtn">別の発注書を作成</button>
    </div>
    <div id="previewArea"></div>
  </div>
  <style id="pageStyle">@page{size:A4 portrait;margin:6mm;}</style>

</div>

<script>
/* ===== Supabase 設定 ===== */
const SB_URL = "https://vgsolgbyakniabaouqfc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnc29sZ2J5YWtuaWFiYW91cWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNjkwODMsImV4cCI6MjA5NTk0NTA4M30.nW5q5YsS2C8D_qTgAx9L67_x8k72V4N8MG_O34OItFY";
const HDR = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

/* 自社情報 */

/* ===== 単位（プルダウン＋直接入力・localStorageに履歴保持） ===== */
const UNIT_DEFAULT = ["本","台","個","枚","式","セット","kg","m"];
let UNIT_LIST = (function(){
  try{
    const s = JSON.parse(localStorage.getItem("hatchu_unit_list")||"null");
    return Array.isArray(s) && s.length ? s : [...UNIT_DEFAULT];
  }catch(e){ return [...UNIT_DEFAULT]; }

function saveUnitList(){
  try{ localStorage.setItem("hatchu_unit_list", JSON.stringify(UNIT_LIST)); }catch(e){}
}
/* マスタに登録済みの単位も候補に取り込む */
function rebuildUnitList(){

    ? MASTER.map(m=>m.unit).filter(Boolean) : [];
  const all = [...new Set([...UNIT_LIST, ...fromMaster])];
  const html = all.map(u=>`<option value="${String(u).replace(/"/g,"&quot;")}">`).join("");
  const a = document.getElementById("unitList"), b = document.getElementById("unitList2");
  if(a) a.innerHTML = html;
  if(b) b.innerHTML = html;
}
/* 新しい単位を候補に追加 */
function addUnit(v){
  v = String(v||"").trim();
  if(!v || UNIT_LIST.includes(v)) return;
  UNIT_LIST.push(v); saveUnitList(); rebuildUnitList();
}

/* ===== 発注担当者（プルダウン＋直接入力・localStorageに履歴保持） ===== */
const STAFF_DEFAULT = ["永冨","三宅","瀧本","岡本","下岡","冨田","藤田","藤川"];
let STAFF_LIST = (function(){
  try{
    const s = JSON.parse(localStorage.getItem("hatchu_staff_list")||"null");
    // 保存済みリストがあっても、既定の候補は常にマージする（順序は既定を優先）
    return Array.isArray(s) && s.length
      ? [...new Set([...STAFF_DEFAULT, ...s])]
      : [...STAFF_DEFAULT];
  }catch(e){ return [...STAFF_DEFAULT]; }
})();
function saveStaffList(){
  try{ localStorage.setItem("hatchu_staff_list", JSON.stringify(STAFF_LIST)); }catch(e){}
}
function rebuildStaffList(){
  document.getElementById("staffList").innerHTML =
    STAFF_LIST.map(s=>`<option value="${String(s).replace(/"/g,"&quot;")}">`).join("");
}
/* 直近に使った担当者を初期表示 */
(function initStaff(){
  const last = (()=>{ try{ return localStorage.getItem("hatchu_staff_last"); }catch(e){ return null; } })();
  OWN.staff = last || OWN.staff;
  const inp = document.getElementById("staffInput");
  inp.value = OWN.staff;
  rebuildStaffList();
  inp.addEventListener("input", ()=>{ OWN.staff = inp.value.trim(); });
  inp.addEventListener("change", ()=>{
    const v = inp.value.trim();
    OWN.staff = v;
    if(!v) return;
    // 新しい担当者名は候補に追加して次回以降も選べるようにする
    if(!STAFF_LIST.includes(v)){ STAFF_LIST.push(v); saveStaffList(); rebuildStaffList(); }
    try{ localStorage.setItem("hatchu_staff_last", v); }catch(e){}
  });
})();

    const s = localStorage.getItem("hatchu_sup_addr");
    return s ? {...SUP_ADDR_DEFAULT, ...JSON.parse(s)} : {...SUP_ADDR_DEFAULT};
  }catch(e){ return {...SUP_ADDR_DEFAULT}; }
})();
function saveSupAddr(){
  try{ localStorage.setItem("hatchu_sup_addr", JSON.stringify(SUP_ADDR)); }catch(e){}
}

let MASTER = [];         // 全マスタ
let CURRENT = null;      // 選択中の製品行

const $ = id => document.getElementById(id);
const yen = n => "¥" + (Number(n)||0).toLocaleString("ja-JP");

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayJP(){ const d=new Date(); return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"; }
$("todayDisp").textContent = todayJP();

/* ===== マスタ読込 ===== */
async function loadMaster(){
  try{
    const res = await fetch(`${SB_URL}/rest/v1/hatchu_master?select=*&order=supplier,kanri_no`, { headers: HDR });
    if(!res.ok) throw new Error("HTTP "+res.status);
    MASTER = await res.json();
    rebuildSupplierSelect();
    rebuildUnitList();
    renderMasterTable();
    setStatus(`マスタ ${MASTER.length}件 読込完了`, "ok");
  }catch(e){
    setStatus("マスタ読込エラー: "+e.message, "err");
    $("mBody").innerHTML = '<tr><td colspan="8" class="empty">読込エラー: '+esc(e.message)+'</td></tr>';
  }
}

/* 外注先セレクト（発注入力／絞込／datalist）を再構築 */
function rebuildSupplierSelect(){
  const sups = [...new Set(MASTER.map(m=>m.supplier))].sort();
  const keep = $("supplier").value;
  $("supplier").innerHTML = '<option value="">— 選択 —</option>';
  sups.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; $("supplier").appendChild(o); });
  if(sups.includes(keep)) $("supplier").value = keep;

  const keepF = $("mFilterSup").value;
  $("mFilterSup").innerHTML = '<option value="">— 全外注先 —</option>';
  sups.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=s; $("mFilterSup").appendChild(o); });
  if(sups.includes(keepF)) $("mFilterSup").value = keepF;

  $("supplierList").innerHTML = sups.map(s=>`<option value="${esc(s)}">`).join("");
}
function setStatus(msg,cls){ const s=$("statusMsg"); s.textContent=msg; s.className="status "+(cls||""); }

/* 外注先選択 → 製品リスト */
$("supplier").addEventListener("change", e=>{
  const sup = e.target.value;
  const psel = $("product");
  psel.innerHTML = '<option value="">— 製品を選択 —</option>';
  clearProduct();
  if(!sup){ psel.disabled=true; return; }
  MASTER.filter(m=>m.supplier===sup).forEach(m=>{
    const o=document.createElement("option");
    o.value=m.id; o.textContent=`${m.kanri_no}　${m.product_name}`;
    psel.appendChild(o);
  });
  psel.disabled=false;
});

/* 製品選択 → 各フィールド反映 */
$("product").addEventListener("change", e=>{
  const id = e.target.value;
  CURRENT = MASTER.find(m=>String(m.id)===String(id)) || null;
  if(!CURRENT){ clearProduct(); return; }
  $("kanri").value = CURRENT.kanri_no || "";
  $("otno").value  = CURRENT.ot_number || "";
  $("pname").value = CURRENT.product_name || "";
  $("biko").value  = CURRENT.work_type || "";
  $("price").value = CURRENT.unit_price!=null ? Number(CURRENT.unit_price).toLocaleString("ja-JP") : "";
  $("unit").value  = CURRENT.unit || "本";
  recalc();
  // オーダーNoを自動採番して表示（空欄のときのみ・編集可）
  if(!$("orderNoInput").value.trim()){
    nextOrderNo().then(no=>{ if(!$("orderNoInput").value.trim()) $("orderNoInput").value = no; }).catch(()=>{});
  }
});
function clearProduct(){
  CURRENT=null;
  ["kanri","otno","pname","biko","price"].forEach(k=>$(k).value="");
  $("unit").value="";
  $("orderNoInput").value="";
  recalc();
}
$("unit").addEventListener("change", e=>addUnit(e.target.value));

$("qty").addEventListener("input", recalc);
function recalc(){
  const q = Number($("qty").value)||0;
  const p = CURRENT && CURRENT.unit_price!=null ? Number(CURRENT.unit_price) : 0;
  const amt = q*p;
  $("amountDisp").textContent = yen(amt);
  $("createBtn").disabled = !(CURRENT && q>0);
}

/* ===================================================================
   マスタ管理（登録・編集・削除）
   =================================================================== */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let EDIT_ID = null;   // null=新規、値あり=編集

/* 一覧描画（絞込反映） */
function renderMasterTable(){
  const fs = $("mFilterSup").value;
  const kw = $("mFilterKw").value.trim().toLowerCase();
  const rows = MASTER.filter(m=>{
    if(fs && m.supplier!==fs) return false;
    if(kw){
      const hay = [m.kanri_no,m.ot_number,m.product_name,m.work_type].map(v=>String(v||"").toLowerCase()).join(" ");
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
  $("mCount").textContent = `${rows.length} / ${MASTER.length} 件`;
  if(!rows.length){
    $("mBody").innerHTML = '<tr><td colspan="8" class="empty">該当するマスタがありません</td></tr>';
    return;
  }
  $("mBody").innerHTML = rows.map(m=>`
    <tr>
      <td>${esc(m.supplier)}</td>
      <td>${esc(m.kanri_no)}</td>
      <td>${esc(m.ot_number)}</td>
      <td>${esc(m.product_name)}</td>
      <td>${esc(m.work_type)}</td>
      <td>${esc(m.unit||"本")}</td>
      <td class="num">${m.unit_price!=null?"¥"+Number(m.unit_price).toLocaleString("ja-JP"):""}</td>
      <td class="ops">
        <button class="btn btn-ghost btn-sm" data-edit="${esc(m.id)}">編集</button>
        <button class="btn btn-danger btn-sm" data-del="${esc(m.id)}">削除</button>
      </td>
    </tr>`).join("");
}

$("mFilterSup").addEventListener("change", renderMasterTable);
$("mFilterKw").addEventListener("input", renderMasterTable);
$("mReloadBtn").addEventListener("click", loadMaster);

/* モーダル開閉 */
function openModal(rec){
  EDIT_ID = rec ? rec.id : null;
  $("mModalTitle").textContent = rec ? "マスタ編集" : "マスタ新規登録";
  $("fSupplier").value = rec ? (rec.supplier||"")     : ($("mFilterSup").value || "");
  $("fKanri").value    = rec ? (rec.kanri_no||"")     : "";
  $("fOtno").value     = rec ? (rec.ot_number||"")    : "";
  $("fPname").value    = rec ? (rec.product_name||"") : "";
  $("fBiko").value     = rec ? (rec.work_type||"")    : "";
  $("fPrice").value    = rec && rec.unit_price!=null ? rec.unit_price : "";
  $("fUnit").value     = rec ? (rec.unit||"本") : "本";
  fillAddrFields($("fSupplier").value.trim());
  setMMsg("","");
  $("mSaveBtn").disabled = false;
  $("mModal").classList.add("show");
  $("fSupplier").focus();
}
function closeModal(){ $("mModal").classList.remove("show"); EDIT_ID=null; }
function setMMsg(msg,cls){ const e=$("mMsg"); e.textContent=msg; e.className="msg "+(cls||""); }

/* 外注先名 → 住所欄を自動反映 */
function fillAddrFields(sup){
  const a = SUP_ADDR[sup] || {zip:"",addr:""};
  $("fZip").value  = a.zip  || "";
  $("fAddr").value = a.addr || "";
}
$("fSupplier").addEventListener("change", e=>fillAddrFields(e.target.value.trim()));

$("mAddBtn").addEventListener("click", ()=>openModal(null));
$("mCloseBtn").addEventListener("click", closeModal);
$("mCancelBtn").addEventListener("click", closeModal);
$("mModal").addEventListener("click", e=>{ if(e.target===$("mModal")) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("mModal").classList.contains("show")) closeModal(); });

/* 一覧の編集／削除ボタン */
$("mBody").addEventListener("click", async e=>{
  const eb = e.target.closest("[data-edit]");
  const db = e.target.closest("[data-del]");
  if(eb){
    const rec = MASTER.find(m=>String(m.id)===String(eb.dataset.edit));
    if(rec) openModal(rec);
    return;
  }
  if(db){
    const rec = MASTER.find(m=>String(m.id)===String(db.dataset.del));
    if(!rec) return;
    if(!confirm(`次のマスタを削除します。よろしいですか？\n\n外注先：${rec.supplier}\n製番：${rec.kanri_no}\n品名：${rec.product_name}`)) return;
    try{
      const res = await fetch(`${SB_URL}/rest/v1/hatchu_master?id=eq.${encodeURIComponent(rec.id)}`,
        { method:"DELETE", headers:{...HDR, Prefer:"return=minimal"} });
      if(!res.ok) throw new Error(await res.text());
      setStatus("マスタを削除しました","ok");
      const wasCur = CURRENT && String(CURRENT.id)===String(rec.id);
      await loadMaster();
      if(wasCur){ $("product").selectedIndex=0; clearProduct(); }
      refreshProductList();
    }catch(err){
      setStatus("削除失敗: "+err.message,"err");
      alert("削除に失敗しました：\n"+err.message);
    }
  }
});

/* 保存（新規=POST / 編集=PATCH） */
$("mSaveBtn").addEventListener("click", async ()=>{
  const rec = {
    supplier:     $("fSupplier").value.trim(),
    kanri_no:     $("fKanri").value.trim(),
    ot_number:    $("fOtno").value.trim(),
    product_name: $("fPname").value.trim(),
    work_type:    $("fBiko").value.trim(),
    unit:         $("fUnit").value.trim(),
    unit_price:   $("fPrice").value===""? null : Number($("fPrice").value)
  };
  // 入力チェック
  if(!rec.supplier){ setMMsg("外注先を入力してください","err"); $("fSupplier").focus(); return; }
  if(!rec.kanri_no){ setMMsg("製番（管理No）を入力してください","err"); $("fKanri").focus(); return; }
  if(!rec.product_name){ setMMsg("品名（製品名）を入力してください","err"); $("fPname").focus(); return; }
  if(!rec.unit){ setMMsg("単位を入力してください","err"); $("fUnit").focus(); return; }
  if(rec.unit_price===null || isNaN(rec.unit_price) || rec.unit_price<0){
    setMMsg("発注単価を正しく入力してください","err"); $("fPrice").focus(); return;
  }
  // 重複チェック（外注先＋製番＋品名＋作業区分）
  const dup = MASTER.find(m=>
    String(m.id)!==String(EDIT_ID) &&
    m.supplier===rec.supplier && m.kanri_no===rec.kanri_no &&
    (m.product_name||"")===rec.product_name && (m.work_type||"")===rec.work_type);
  if(dup){ setMMsg("同じ外注先・製番・品名・作業区分のマスタが既に存在します","err"); return; }

  $("mSaveBtn").disabled = true;
  setMMsg("保存中…","");
  try{
    let res;
    if(EDIT_ID===null){
      res = await fetch(`${SB_URL}/rest/v1/hatchu_master`,
        { method:"POST", headers:{...HDR, Prefer:"return=minimal"}, body: JSON.stringify(rec) });
    }else{
      res = await fetch(`${SB_URL}/rest/v1/hatchu_master?id=eq.${encodeURIComponent(EDIT_ID)}`,
        { method:"PATCH", headers:{...HDR, Prefer:"return=minimal"}, body: JSON.stringify(rec) });
    }
    if(!res.ok) throw new Error(await res.text());
    addUnit(rec.unit);
    // 外注先住所を保存（外注先単位）
    SUP_ADDR[rec.supplier] = { zip: $("fZip").value.trim(), addr: $("fAddr").value.trim() };
    saveSupAddr();
    const wasNew = EDIT_ID===null;
    const editedId = EDIT_ID;
    closeModal();
    await loadMaster();
    refreshProductList();
    // 編集中の製品を選択していた場合は表示を更新
    if(!wasNew && CURRENT && String(CURRENT.id)===String(editedId)){
      const fresh = MASTER.find(m=>String(m.id)===String(editedId));
      if(fresh){ $("product").value = fresh.id; $("product").dispatchEvent(new Event("change")); }
    }
    setStatus(wasNew ? "マスタを登録しました" : "マスタを更新しました", "ok");
  }catch(e){
    setMMsg("保存失敗: "+e.message, "err");
    $("mSaveBtn").disabled = false;
  }
});

/* 発注入力側の製品リストを現在の外注先で再構築（選択は維持） */
function refreshProductList(){
  const sup = $("supplier").value;
  const psel = $("product");
  const keep = psel.value;
  psel.innerHTML = '<option value="">— 製品を選択 —</option>';
  if(!sup){ psel.disabled=true; return; }
  MASTER.filter(m=>m.supplier===sup).forEach(m=>{
    const o=document.createElement("option");
    o.value=m.id; o.textContent=`${m.kanri_no}　${m.product_name}`;
    psel.appendChild(o);
  });
  psel.disabled=false;
  if(keep && MASTER.some(m=>String(m.id)===String(keep))) psel.value = keep;
}

/* ===== オーダーNo採番 ===== */
async function nextOrderNo(){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/next_hatchu_order_no`, { method:"POST", headers:HDR, body:"{}" });
  if(!res.ok) throw new Error("採番失敗 HTTP "+res.status);
  return await res.json();
}

/* ===== 作成ボタン ===== */
$("createBtn").addEventListener("click", async ()=>{
  if(!CURRENT) return;
  const qty = Number($("qty").value)||0;
  if(qty<=0){ setStatus("発注数を入力してください","err"); return; }
  OWN.staff = $("staffInput").value.trim();
  if(!OWN.staff){ setStatus("発注担当者を入力してください","err"); $("staffInput").focus(); return; }
  addUnit($("unit").value);
  $("createBtn").disabled=true; setStatus("作成中…","");
  try{
    let orderNo = $("orderNoInput").value.trim();
    if(!orderNo){ orderNo = await nextOrderNo(); $("orderNoInput").value = orderNo; }
    const price = CURRENT.unit_price!=null?Number(CURRENT.unit_price):0;
    const amount = qty*price;
    const delivery = $("delivery").value.trim();
    const rec = {
      order_no: orderNo, supplier: CURRENT.supplier, kanri_no: CURRENT.kanri_no,
      ot_number: CURRENT.ot_number, product_name: CURRENT.product_name,
      work_type: ($("biko").value.trim() || CURRENT.work_type || ""), unit: ($("unit").value.trim() || CURRENT.unit || "本"), delivery_date: delivery,
      order_qty: qty, unit_price: price, amount: amount, order_date: todayISO()
    };
    const ins = await fetch(`${SB_URL}/rest/v1/hatchu_orders`, { method:"POST", headers:{...HDR, Prefer:"return=minimal"}, body: JSON.stringify(rec) });
    if(!ins.ok){ const t=await ins.text(); throw new Error("保存失敗: "+t); }
    renderDocuments(rec);
    setStatus(`作成完了（オーダーNo ${orderNo}）`, "ok");
    $("previewPanel").style.display="block";
    $("orderNoTag").textContent = "オーダーNo "+orderNo;
    if($("previewPanel").scrollIntoView) $("previewPanel").scrollIntoView({behavior:"smooth"});
  }catch(e){
    setStatus(e.message,"err"); $("createBtn").disabled=false;
  }
});

$("newBtn").addEventListener("click", ()=>{
  $("previewPanel").style.display="none";
  $("previewArea").innerHTML="";
  $("qty").value=""; $("delivery").value="";
  $("product").selectedIndex=0; clearProduct();
  window.scrollTo({top:0,behavior:"smooth"});
});

/* ===== 備考を1文字ずつ〇で囲む ===== */
function bikoCircled(text){
  if(!text) return "";
  // 「機械加工」と完全一致のときは〇囲み・文字間隔なしのプレーン表示
  if(text.trim()==="機械加工") return esc(text.trim());
  // 全角/半角スペースを除去して1文字ずつ
  const chars = text.replace(/[\s　]+/g,"").split("");
  return '<span class="biko-circ">'+chars.map(c=>`<span>${c}</span>`).join("")+'</span>';
}

        <div class="th-onbox">
          <div>発注日：${dJP}</div>
          <div><span class="onbox">オーダーNo <b>${r.order_no}</b></span></div>
        </div>
      </div>
      <div class="th-addr">
        <div class="th-left">
          <div>〒${sup.zip}　${sup.addr||""}</div>
          <div class="onchu"><span class="big">${r.supplier}</span>　御中</div>
        </div>
        <div class="th-right">
          <div>〒${OWN.zip}　${OWN.addr}</div>
          <div class="th-name-row"><img class="ownlogo ownlogo-side" src="${LOGO}" alt="OSAKA TEC"><span class="big">${OWN.name}</span></div>
          <div>${OWN.staff}</div>
        </div>
      </div>
    </div>`;

  // ヘッダB：現品票/納品書/受領書/請求書用
  //  variant: 'genpin' → 右にオーダーNo＋左隣ロゴ（現品票）
  //           'other'  → 発注日の左にロゴ、発注日・担当者を一行下げる（納品書/受領書/請求書）
  const headOther = (title, showStaff=true, variant='other') => `
    <div class="thead">
      <div class="th-titlebar three">
        <div class="th-onleft">
          <div class="onbox">オーダーNo <b>${r.order_no}</b></div>
          <div class="onchu"><span class="big">${r.supplier}</span>　御中</div>
        </div>
        <div class="th-title">${title}</div>
        <div class="th-onbox">
          ${variant==='genpin'
            ? `<div class="th-onno-row"><img class="ownlogo ownlogo-side" src="${LOGO}" alt="OSAKA TEC"><span>オーダーNo ${r.order_no}</span></div>
               <div>発注日：${dJP}</div>
               ${showStaff?`<div>発注担当者：${OWN.name}　${OWN.staff}</div>`:`<div class="big">${OWN.name}</div>`}`
            : `<div class="th-spacer">&nbsp;</div>
               <div class="th-onno-row"><img class="ownlogo ownlogo-side" src="${LOGO}" alt="OSAKA TEC"><span>発注日：${dJP}</span></div>
               ${showStaff?`<div>発注担当者：${OWN.name}　${OWN.staff}</div>`:`<div class="big">${OWN.name}</div>`}`
          }
        </div>
      </div>
    </div>`;

  const 発注書 = `<div class="form-block">${headHatchu}${gridFull}</div>`;
  const 現品票 = `<div class="form-block">${headOther("現品票",true,'genpin')}${gridGenpin}</div>`;
  const 納品書 = `<div class="form-block">${headOther("納品書",true,'other')}${gridNouhin}</div>`;
  const 受領書 = `<div class="form-block">${headOther("受領書",true,'other')}${gridJuryo}</div>`;
  const 請求書 = `<div class="form-block">${headOther("請求書",false,'other')}${gridSeikyu}</div>`;

  // 切り取り線
  const cut = '<div class="cut-line"><span class="scissors">✂</span></div>';

  $("previewArea").innerHTML =
    `<div class="sheet">${発注書}${cut}${現品票}${cut}${納品書}${cut}${受領書}${cut}${請求書}</div>`;
}

/* 初期化 */
rebuildUnitList();
loadMaster();
</script>
</body>
</html>
